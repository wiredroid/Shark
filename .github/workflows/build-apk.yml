name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          sdkmanager_path="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f | head -1)"
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create temporary release signing key
        working-directory: app
        run: |
          mkdir -p keystore
          keytool -genkeypair \
            -keystore keystore/release.jks \
            -storepass android \
            -keypass android \
            -alias shark-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Shark Release, OU=Build, O=Shark, L=Unknown, ST=Unknown, C=US"
          cat > keystore.properties <<'EOF'
          storeFile=keystore/release.jks
          storePassword=android
          keyAlias=shark-release
          keyPassword=android
          EOF

      - name: Build release APK
        working-directory: app
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shark-release-apk
          path: app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
